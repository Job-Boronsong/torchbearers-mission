{% extends "core/base.html" %}
{% load static %}

{% block content %}
<section class="py-5 page-section">
  <div class="container">

    <!-- Page Title -->
    <h1 class="fw-bold mb-5 text-center">Blog</h1>

    <!-- Blog Grid -->
    <div class="row g-4">

      {% for post in posts %}
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">

            <!-- Blog Image -->
            {% if post.feature_image %}
              <img
                src="{{ post.feature_image.url }}"
                class="card-img-top"
                alt="{{ post.title }}"
                style="height:220px; object-fit:cover;"
              >
            {% else %}
              <img
                src="{% static 'images/blog-placeholder.jpg' %}"
                class="card-img-top"
                alt="Blog image"
                style="height:220px; object-fit:cover;"
              >
            {% endif %}

            <!-- Card Body -->
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ post.title }}</h5>

              <p class="text-muted small mb-3">
                {{ post.created_at|date:"F d, Y" }}
              </p>

              <a
                href="{% url 'core:blog_detail' post.slug %}"
                class="btn btn-primary mt-auto"
              >
                Read More
              </a>
            </div>

          </div>
        </div>

      {% empty %}
        <div class="col-12 text-center">
          <p class="text-muted">No blog posts yet.</p>
        </div>
      {% endfor %}

    </div>

  </div>
</section>
{% endblock %}
