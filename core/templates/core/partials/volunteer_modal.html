{% load static %}

<div class="modal fade" id="volunteerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <form method="post" action="{% url 'core:register_volunteer' %}">
        {% csrf_token %}

        <!-- Honeypot -->
        <input type="text" name="website" style="display:none">

        <div class="modal-header">
          <h5 class="modal-title">Become a Volunteer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input type="text" name="full_name" class="form-control mb-3"
                 required placeholder="Full Name">

          <input type="email" name="email" class="form-control mb-3"
                 required placeholder="Email">

          <input type="text" name="phone" class="form-control mb-3"
                 placeholder="Phone">

          <textarea name="message" class="form-control mb-3"
                    rows="3" placeholder="Message"></textarea>

          {% if CLOUDFLARE_TURNSTILE_SITE_KEY %}
          <!-- Cloudflare Turnstile -->
          <div class="cf-turnstile"
               data-sitekey="{{ CLOUDFLARE_TURNSTILE_SITE_KEY }}">
          </div>
          {% endif %}
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary w-100">
            Submit
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

{% if CLOUDFLARE_TURNSTILE_SITE_KEY %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
